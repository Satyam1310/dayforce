name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: timecards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d timecards"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

      - name: Run backend tests (with the database)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/timecards
        run: python -m pytest -q

  frontend:
    name: Frontend - Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
